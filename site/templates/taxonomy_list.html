{% extends "base.html" %}

{% block title %}{{ taxonomy.name }} — {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ taxonomy.name }}</h1>
<div class="family-grid">
{% for term in terms %}
<a href="{{ term.permalink }}" class="family-card">
    <h3>{{ term.name }}</h3>
    <span class="count">{{ term.pages | length }} thinkers</span>
</a>
{% endfor %}
</div>
{% endblock %}
