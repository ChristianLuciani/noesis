name: Validate Thinkers

on:
  pull_request:
    paths:
      - 'thinkers/**'
  push:
    branches: [main]
    paths:
      - 'thinkers/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tomli jsonschema

      - name: Validate all thinkers
        run: python scripts/validate-thinkers.py
